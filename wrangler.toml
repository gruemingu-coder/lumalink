# Deploy target for this config: Cloudflare Pages.
#
# Static site build (`./dist`) + a Pages Function for the accounts/
# device-sync API under /api/*, defined in `functions/api/[[route]].ts`
# (the API logic itself lives in `worker/index.ts`, shared by both this
# config and that Function).
#
# NOTE: This is a *different* product from a plain Cloudflare Worker.
# If you previously deployed this project with `wrangler deploy`
# (Workers + Static Assets), that is a separate deployment target —
# see the migration notes in README.md.
#
# Deploy manually with:
#   npm run build && npx wrangler pages deploy dist --project-name=alavex
# Or connect this repo to a Pages project in the Cloudflare dashboard
# (Workers & Pages -> Create -> Pages -> Connect to Git) for automatic
# build + deploy on every git push.
name = "alavex"
pages_build_output_dir = "./dist"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# Same D1 database used before. `preview_database_id` controls which
# database non-production (preview/branch) deploys use — set to the
# same id as `database_id` to share one database with production, or
# provision a second D1 database and put its id here if you want
# preview deploys fully isolated from production data.
[[d1_databases]]
binding = "DB"
database_name = "lumalink"
database_id = "28a58839-697e-4f24-930e-305f3ce49df4"
preview_database_id = "28a58839-697e-4f24-930e-305f3ce49df4"

# Set the real secret with (once the Pages project exists):
#   npx wrangler pages secret put JWT_SECRET --project-name=alavex
# before deploying — do not commit a real value here. For local
# `wrangler pages dev`, put it in a git-ignored `.dev.vars` file instead
# (see .dev.vars.example).
