[package]
name = "lumalink-host"
version = "0.3.0"
description = "LumaLink Host App - runs on your gaming PC, pairs with LumaLink streaming clients over the LAN, and shares your screen over WebRTC."
authors = ["LumaLink"]
edition = "2021"

[lib]
name = "lumalink_host_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon"] }
tauri-plugin-store = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
enigo = "0.2"
mac_address = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# DXGI desktop duplication — LumaLink's own capture path (not Sunshine/Moonlight).
scrap = "0.5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
