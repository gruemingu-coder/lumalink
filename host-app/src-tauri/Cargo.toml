[package]
name = "alavex-host-app"
version = "0.5.0"
description = "AlaveX Host App - DXGI + NVENC native capture for AlaveX streaming clients."
authors = ["AlaveX"]
edition = "2021"

[lib]
name = "alavex_host_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon"] }
tauri-plugin-store = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
enigo = "0.2"
mac_address = "1"
dirs = "5"
ureq = "2"
zip = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
scrap = "0.5"
vigem-client = "0.1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
