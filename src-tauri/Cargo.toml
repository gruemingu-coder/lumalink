[package]
name = "alavex-streaming-app"
version = "0.5.0"
description = "AlaveX Streaming App - native client (Windows, macOS, Android, iOS) for remote PC game streaming."
authors = ["AlaveX"]
edition = "2021"

[lib]
name = "alavex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
