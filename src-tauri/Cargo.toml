[package]
name = "lumalink"
version = "0.2.0"
description = "LumaLink Streaming App - native desktop client for the LumaLink remote game streaming demo."
authors = ["LumaLink"]
edition = "2021"

[lib]
name = "lumalink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
