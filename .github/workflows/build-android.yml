name: Build Android APK (Streaming)

# LumaLink Streaming client APK via Tauri 2 mobile.
# Host stays Windows-only (DXGI).

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  NDK_VERSION: "27.0.12077973"
  ANDROID_API: "34"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components + NDK
        run: |
          sdkmanager "platforms;android-${ANDROID_API}" "build-tools;${ANDROID_API}.0.0" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: npm install

      - name: Ensure icons
        shell: bash
        run: |
          if [ ! -f src-tauri/icons/icon.png ]; then
            python3 - <<'PY'
          from struct import pack
          import zlib, pathlib
          def chunk(t, d):
              return pack('>I', len(d)) + t + d + pack('>I', zlib.crc32(t + d) & 0xffffffff)
          raw = b''.join(b'\x00' + bytes([30,40,80])*1024 for _ in range(1024))
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', pack('>IIBBBBB', 1024, 1024, 8, 2, 0, 0, 0))
          png += chunk(b'IDAT', zlib.compress(raw, 9)) + chunk(b'IEND', b'')
          pathlib.Path('placeholder.png').write_bytes(png)
          PY
            npx tauri icon placeholder.png
          fi

      - name: Init Android project if missing
        run: |
          if [ ! -f src-tauri/gen/android/app/build.gradle.kts ] && [ ! -f src-tauri/gen/android/app/build.gradle ]; then
            rm -rf src-tauri/gen/android
            npx tauri android init --ci
          fi
        env:
          CI: true
          NDK_HOME: ${{ env.NDK_HOME }}

      - name: Build frontend
        run: npm run build

      - name: Build Android APK
        run: |
          set -o pipefail
          npx tauri android build --apk -v 2>&1 | tee android-build.log
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android-build.log
          if-no-files-found: ignore

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumalink-android-apk
          path: |
            src-tauri/gen/android/**/apk/**/*.apk
            src-tauri/gen/android/**/*.apk
          if-no-files-found: error

  publish-apk-to-site:
    name: Publish APK to public/downloads
    needs: android
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/download-artifact@v4
        with:
          name: lumalink-android-apk
          path: artifacts/android

      - name: Copy APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/downloads
          apk=$(find artifacts/android -name '*.apk' | head -n1)
          cp "$apk" public/downloads/LumaLink-Streaming.apk

      - name: Commit and push APK
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: publish Android streaming app (${{ github.ref_name }})"
          file_pattern: "public/downloads/LumaLink-Streaming.apk"
          branch: ${{ github.event.repository.default_branch }}
